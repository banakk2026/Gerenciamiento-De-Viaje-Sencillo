<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciamiento de Viaje</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c0508">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gerenciamiento">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--sans:"Segoe UI","Helvetica Neue",Helvetica,Arial,Roboto,sans-serif;--serif:Georgia,"Times New Roman",Times,serif;--bg:#0b0b0e;--card:#17171c;--ink:#f4f1f1;--mut:#b6abae;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.24);--ac:#ff4d55;--acb:#c1121f;--acs:rgba(229,32,43,.2);--soft:rgba(255,255,255,.045);--wb:rgba(242,185,5,.12);--wi:#ffd666;--wl:#f2b705;--bb:rgba(229,72,77,.16);--bi:#ff9aa0;--bl:#e5484d;--ob:rgba(70,167,88,.15);--oi:#8fd9a3;--ol:#46a758;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;background-color:#050506;background-image:radial-gradient(900px 520px at 10% -5%,rgba(229,32,43,.4),transparent 60%),radial-gradient(800px 640px at 105% 100%,rgba(163,18,28,.5),transparent 55%),linear-gradient(165deg,#050506 0%,#12040a 45%,#2a060b 75%,#4d0a12 100%);background-repeat:no-repeat;min-height:100vh;min-height:100dvh}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:780px;margin:0 auto;padding:clamp(16px,4vw,28px) max(clamp(12px,4vw,18px),env(safe-area-inset-right,0px)) 40px max(clamp(12px,4vw,18px),env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:clamp(12px,3vw,18px);background:linear-gradient(115deg,rgba(212,21,31,.96),rgba(96,9,17,.94) 46%,rgba(11,11,14,.96));border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:clamp(12px,3.5vw,16px) clamp(14px,4vw,22px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.5);margin-bottom:clamp(16px,4vw,26px)}
.logo{width:clamp(88px,26vw,128px);height:auto;flex:none;background:#fff;padding:5px 10px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
h1{color:#fff;font:500 clamp(18px,5.2vw,24px)/1.15 var(--serif);margin:0;letter-spacing:.4px}
.top p{display:inline-block;margin:8px 0 0;padding:3px 11px;border:1px solid rgba(255,255,255,.35);border-radius:99px;color:rgba(255,255,255,.85);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.14);transition:background .3s}
.prog i.on{background:linear-gradient(90deg,#ff4d55,#c1121f)}
.prog i.cur{box-shadow:0 0 12px rgba(255,77,85,.8)}
#no{display:flex;align-items:center;gap:14px;margin:16px 2px 14px;color:#ff6b72;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
#no::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.28),transparent)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:clamp(18px,5vw,30px) clamp(14px,4.5vw,26px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 28px 70px rgba(0,0,0,.55)}
h2{color:#fff;font:500 clamp(20px,5.6vw,26px)/1.2 var(--serif);margin:0 0 24px;letter-spacing:.3px}
h2::after{content:"";display:block;width:56px;height:2px;margin-top:14px;background:linear-gradient(90deg,#ff4d55,transparent)}
.note{background:var(--wb);color:var(--wi);border-left:3px solid var(--wl);padding:12px 16px;border-radius:10px;font-size:14px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}.grid>*{min-width:0}
.full{grid-column:1/-1}
label.f span{display:block;margin-bottom:8px;color:#f7f1f1;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
legend{display:block;margin-bottom:10px;padding:0;color:#fff;font-size:16px;font-weight:500}
input[type=text],input[type=tel],input[type=date],input[type=time],textarea{display:block;width:100%;max-width:100%;min-width:0;min-height:50px;-webkit-appearance:none;appearance:none;padding:12px 14px;font:16px var(--sans);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,textarea:focus{outline:0;border-color:var(--ac);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(255,77,85,.22)}
fieldset{border:0;padding:0;margin:0 0 18px;grid-column:1/-1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative}
.chip input,.opt input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:46px;padding:0 26px;border:1px solid var(--line2);border-radius:99px;cursor:pointer;font-weight:600;letter-spacing:.04em;background:var(--soft);transition:all .15s}
.chip span:hover,.opt:hover{border-color:rgba(255,255,255,.45)}
.chip input:checked+span{background:linear-gradient(135deg,#e5202b,#8f0d16);border-color:#ff6b72;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px rgba(229,32,43,.4)}
.chip input:focus-visible+span,.opt:has(input:focus-visible){outline:2px solid var(--ac);outline-offset:2px}
.opt{min-width:0;display:flex;align-items:center;gap:14px;position:relative;padding:13px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:var(--soft);transition:all .15s}
.opt::before{content:"";flex:none;width:20px;height:20px;border:2px solid var(--line2);border-radius:50%;transition:all .15s}
.opt span{flex:1;min-width:0;overflow-wrap:anywhere}
.opt:has(input:checked){border-color:var(--ac);background:linear-gradient(90deg,rgba(229,32,43,.28),rgba(229,32,43,.05));box-shadow:0 0 0 1px rgba(255,77,85,.35)}
.opt:has(input:checked)::before{border-color:var(--ac);background:radial-gradient(circle,var(--ac) 45%,transparent 50%)}
.opt b{flex:none;font-size:11px;letter-spacing:.06em;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.ban{padding:13px 16px;border-radius:12px;font-size:14px;font-weight:600;margin:14px 0;border-left:3px solid}
.ban.w{background:var(--wb);color:var(--wi);border-color:var(--wl)}.ban.b{background:var(--bb);color:var(--bi);border-color:var(--bl)}.ban.o{background:var(--ob);color:var(--oi);border-color:var(--ol)}
.tot{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-left:5px solid var(--line2);border-radius:14px;padding:16px 20px;margin-top:14px;background:var(--soft)}
.tot.l0{border-left-color:#2fa84f}.tot.l1{border-left-color:#f2b705}.tot.l2{border-left-color:#e5484d}
.tot strong{font:500 clamp(32px,9vw,42px)/1 var(--serif);background:linear-gradient(180deg,#fff,#ff9aa0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tot small{color:var(--mut)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;font-size:15px;margin:18px 0;padding:16px 18px;background:var(--soft);border:1px solid var(--line);border-radius:12px}dt{color:var(--mut)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
button{font:600 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;min-height:50px;padding:0 28px;border-radius:12px;border:1px solid rgba(255,120,125,.5);background:linear-gradient(135deg,#e5202b,#9b0f19 60%,#4a060b);color:#fff;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(229,32,43,.3);transition:transform .1s,filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.98)}
button.g{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.25);box-shadow:none}
button.x{background:linear-gradient(135deg,#2b2b32,#0d0d11);border-color:#e5202b;box-shadow:none}
button:disabled{opacity:.35;cursor:default;box-shadow:none;filter:none}
#next::after{content:"  \2192"}
.dls{display:flex;flex-direction:column;gap:12px;max-width:340px;margin-top:8px}.dls+button{margin-top:16px}
.sigw{border:1.5px dashed var(--line2);border-radius:12px;background:#fff;max-width:520px;overflow:hidden}
#pad{display:block;width:100%;aspect-ratio:8/3;touch-action:none;cursor:crosshair}
.sigb{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;max-width:520px}.sigb small{color:var(--mut)}.sigb button{min-height:40px;padding:0 14px;font-size:11px}
#msg{color:var(--bi);font-size:14px;min-height:20px;margin-top:12px}
.anim>*{animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ft{margin-top:28px;text-align:center;color:rgba(255,255,255,.4);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
.note,.ban,legend,h1,h2,label.f span{overflow-wrap:anywhere}
.top>div{min-width:0}
textarea{resize:vertical}
button{max-width:100%;white-space:normal;line-height:1.2}
@media (max-width:520px){
.nav button{flex:1;padding:0 12px}
.dls{max-width:none}.dls+button{width:100%}
.chips{gap:8px}.chip span{padding:0 20px}
.sigb{flex-direction:column;align-items:stretch}.sigb button{width:100%}
#no{letter-spacing:.16em}
button{letter-spacing:.06em}}
@media (max-width:420px){dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:10px}}
.off{opacity:.5}input:disabled{cursor:not-allowed}
.hint{display:block;margin:-2px 0 8px;color:rgba(255,255,255,.82);font-size:14px;overflow-wrap:anywhere}
#gb{width:100%}.gl{margin:-6px 0 20px;color:rgba(255,255,255,.82);overflow-wrap:anywhere}.gh{margin:12px 0 0;font-size:13px}#gm{min-height:20px;margin-top:10px;font-size:14px;color:var(--bi)}#gr{margin-top:6px}
</style>
</head>

const LS={get(){try{return JSON.parse(localStorage.getItem('acc'))}catch(e){return null}},set(v){try{localStorage.setItem('acc',JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem('acc')}catch(e){}}};
const call=async q=>{if(API.indexOf('http')!==0)throw new Error('cfg');const r=await fetch(API+'?'+new URLSearchParams(Object.assign({},q,{_:Date.now()})),{cache:'no-store'});return r.json()};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let timer;
async function unlock(kb){
 const k=await crypto.subtle.importKey('raw',b64(kb),'AES-GCM',false,['decrypt']),b=b64(PAY);
 const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12))));
 g('app').innerHTML=o.h;const s=document.createElement('script');s.textContent=o.j;document.body.appendChild(s);
 g('gate').hidden=true;g('app').hidden=false;scrollTo(0,0);watch()}
function watch(){
 const re=async()=>{const a=LS.get();if(!a)return;try{const r=await call({action:'status',id:a.id});if(r.estado!=='aprobado'){g('app').innerHTML='';location.reload()}}catch(e){}};
 setInterval(re,30000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)re()});
 addEventListener('pageshow',e=>{if(e.persisted)re()})}
const chk=()=>{const ok=g('gn').value.trim().length>1&&g('gs').value.trim().length>1;g('gb').disabled=!ok;g('gh').style.display=ok?'none':''};
function form(){clearTimeout(timer);g('gw').hidden=true;g('gf').hidden=false;g('gb').disabled=true;chk()}
function wait(){g('gf').hidden=true;g('gw').hidden=false;g('gr').hidden=true;g('gt').textContent='Verificando acceso…';check()}
async function check(){
 const a=LS.get();if(!a)return form();
 try{const r=await call({action:'status',id:a.id});
  if(r.estado==='aprobado'&&r.key){await unlock(r.key);return}
  if(r.estado==='rechazado'){g('gt').textContent='Tu solicitud de acceso no fue aprobada. Si crees que es un error, comunícate con el administrador.';g('gr').hidden=false;return}
  if(r.estado==='desconocido'){LS.del();return form()}
  g('gt').textContent='Solicitud enviada. Estás a la espera de la aprobación del administrador. Esta pantalla se actualiza sola cuando se te otorgue el acceso.'}
 catch(e){g('gt').textContent=e&&e.message==='cfg'?'El servicio de acceso todavía no está configurado.':'Sin conexión con el servicio de acceso. Reintentando…'}
 timer=setTimeout(check,6000)}
g('gn').oninput=g('gs').oninput=chk;
g('gn').onkeydown=g('gs').onkeydown=e=>{if(e.key==='Enter'&&!g('gb').disabled)g('gb').click()};
g('gr').onclick=()=>{LS.del();form()};
g('gb').onclick=async()=>{
 const n=g('gn').value.trim(),s=g('gs').value.trim(),m=g('gm');g('gb').disabled=true;m.textContent='Enviando solicitud…';
 try{const r=await call({action:'request',n,s});if(!r.ok)throw new Error(r.msg||'x');LS.set({id:r.id,n,s});m.textContent='';wait()}
 catch(e){m.textContent=e&&e.message==='cfg'?'El servicio de acceso todavía no está configurado.':e&&e.message==='limite'?'Hay demasiadas solicitudes en este momento. Inténtalo más tarde.':'No se pudo enviar la solicitud. Revisa tu conexión e inténtalo nuevamente.';chk()}};
LS.get()?wait():form();
})();
</script>
